<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Session Sign-Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 36px;
      max-width: 700px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .header-icon {
      background: #005a2b;
      border-radius: 10px;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    h1 { font-size: 1.55rem; color: #1a2e1a; font-weight: 700; }

    .subtitle {
      color: #556b55; font-size: 0.97rem;
      margin-bottom: 28px; margin-top: 4px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block; font-weight: 600; color: #1a2e1a;
      margin-bottom: 7px; font-size: 0.95rem;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #c8d8c8; border-radius: 7px;
      font-size: 0.97rem; color: #1a2e1a; background: #f7faf7;
      transition: border-color 0.2s; outline: none; font-family: inherit;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      border-color: #005a2b; background: #fff;
    }

    textarea { resize: vertical; min-height: 80px; }

    .topic-group { margin-bottom: 18px; }

    .topic-header {
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px; margin-bottom: 8px;
    }

    .topic-name {
      font-weight: 700; font-size: 1rem; color: #1a2e1a;
      display: flex; align-items: center; gap: 8px;
    }

    .topic-badge {
      font-size: 0.75rem; font-weight: 700;
      padding: 2px 9px; border-radius: 20px; white-space: nowrap;
    }

    .badge-available { background: #e6f2e6; color: #005a2b; }
    .badge-full      { background: #fdecea; color: #922b21; }

    .sessions-grid { display: flex; flex-direction: column; gap: 10px; }

    .session-card {
      border: 1.5px solid #d4e4d4; border-radius: 9px;
      padding: 12px 16px; cursor: pointer;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
      position: relative; background: #f7faf7; user-select: none;
    }

    .session-card:hover:not(.full) {
      border-color: #005a2b; background: #eef6ee;
      box-shadow: 0 2px 10px rgba(0,90,43,0.08);
    }

    .session-card.selected {
      border-color: #005a2b; background: #e6f2e6;
      box-shadow: 0 2px 10px rgba(0,90,43,0.13);
    }

    .session-card.full {
      opacity: 0.52; cursor: not-allowed; background: #f0f0f0; border-color: #ccc;
    }

    .session-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }

    .session-top {
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
    }

    .session-left { display: flex; align-items: center; gap: 12px; }

    .radio-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #aac8aa; background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: border-color 0.18s, background 0.18s;
    }

    .session-card.selected .radio-dot { border-color: #005a2b; background: #005a2b; }

    .radio-dot-inner {
      width: 8px; height: 8px; border-radius: 50%; background: #fff; display: none;
    }

    .session-card.selected .radio-dot-inner { display: block; }

    .session-topic { font-weight: 700; color: #1a2e1a; font-size: 0.95rem; }
    .session-time  { font-size: 0.86rem; color: #556b55; margin-top: 2px; }

    .session-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .capacity-bar-wrap {
      width: 110px; height: 6px; background: #d4e4d4; border-radius: 4px; overflow: hidden;
    }

    .capacity-bar { height: 100%; border-radius: 4px; background: #005a2b; transition: width 0.3s; }
    .capacity-bar.warning  { background: #e07c00; }
    .capacity-bar.full-bar { background: #c0392b; }

    .capacity-text           { font-size: 0.80rem; color: #556b55; white-space: nowrap; }
    .capacity-text.warning   { color: #e07c00; font-weight: 700; }
    .capacity-text.full-text { color: #c0392b; font-weight: 700; }

    .alert-banner {
      margin-top: 8px; padding: 7px 12px; border-radius: 6px;
      font-size: 0.84rem; font-weight: 600;
      display: flex; align-items: center; gap: 7px;
    }

    .alert-warning { background: #fff4e0; color: #a05a00; border: 1px solid #f0c060; }
    .alert-full    { background: #fdecea; color: #922b21; border: 1px solid #f5c6c3; }

    /* Request more times */
    .request-time-box {
      margin-top: 10px; border: 1.5px dashed #c0392b;
      border-radius: 9px; background: #fff8f8; overflow: hidden;
    }

    .request-time-trigger {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px; cursor: pointer; user-select: none;
    }

    .request-time-trigger:hover { background: #fdecea; }

    .request-time-trigger input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #c0392b;
      cursor: pointer; flex-shrink: 0;
    }

    .request-time-label {
      font-size: 0.9rem; font-weight: 600; color: #922b21;
    }

    .request-time-label span {
      font-weight: 400; color: #a05a00; font-size: 0.83rem; margin-left: 6px;
    }

    .request-time-panel {
      display: none; padding: 0 16px 14px; border-top: 1px solid #f5c6c3;
    }

    .request-time-panel.open { display: block; }

    .request-time-panel label {
      font-size: 0.88rem; font-weight: 600; color: #922b21;
      margin-bottom: 6px; margin-top: 12px;
    }

    .time-prefs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }

    .time-pref-btn {
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid #e0b0b0; background: #fff;
      color: #922b21; font-size: 0.83rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; user-select: none;
    }

    .time-pref-btn.selected { background: #fdecea; border-color: #c0392b; }
    .time-pref-btn:hover    { background: #fdecea; border-color: #c0392b; }

    .request-note-label { color: #556b55 !important; font-weight: 600 !important; }

    /* Buttons */
    .btn-submit {
      width: 100%; padding: 13px; background: #005a2b; color: #fff;
      font-size: 1.05rem; font-weight: 700; border: none; border-radius: 8px;
      cursor: pointer; margin-top: 10px;
      transition: background 0.18s, transform 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .btn-submit:hover   { background: #004020; }
    .btn-submit:active  { transform: scale(0.98); }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: 5px; min-height: 18px; }

    /* Success */
    .success-screen { display: none; text-align: center; padding: 20px 0 10px; }

    .success-icon {
      width: 64px; height: 64px; background: #e6f2e6; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    }

    .success-title { font-size: 1.4rem; font-weight: 700; color: #005a2b; margin-bottom: 10px; }
    .success-detail { color: #556b55; font-size: 0.97rem; line-height: 1.7; }
    .success-detail strong { color: #1a2e1a; }

    .success-request-note {
      margin-top: 14px; padding: 12px 16px;
      background: #fff8f8; border: 1px solid #f5c6c3;
      border-radius: 8px; font-size: 0.88rem; color: #922b21;
      text-align: left; line-height: 1.5;
    }

    .email-sent-note {
      margin-top: 10px; padding: 8px 14px;
      background: #e6f2e6; border: 1px solid #b0d8b0;
      border-radius: 7px; font-size: 0.84rem; color: #2d6a2d;
      display: flex; align-items: center; gap: 7px;
    }

    .btn-another {
      margin-top: 22px; padding: 10px 28px; background: #005a2b; color: #fff;
      font-weight: 700; border: none; border-radius: 7px; cursor: pointer;
      font-size: 0.97rem; transition: background 0.18s;
    }

    .btn-another:hover { background: #004020; }

    .divider { border: none; border-top: 1.5px solid #e4eee4; margin: 24px 0; }

    .reset-link {
      font-size: 0.8rem; color: #aaa; cursor: pointer;
      text-align: right; display: block; margin-top: 10px;
    }

    .reset-link:hover { color: #c0392b; text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">

  <div id="formSection">
    <div class="header">
      <div class="header-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="17" rx="2.5" stroke="#fff" stroke-width="2"/>
          <path d="M8 2v4M16 2v4M3 9h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 13h4m-4 4h8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Session Sign-Up</h1>
    </div>
    <p class="subtitle">Register for one of the available sessions below. Each session is limited to <strong>25 participants</strong>.</p>

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="e.g. Jane Smith" autocomplete="name"/>
      <div class="error-msg" id="nameError"></div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="e.g. jane.smith@syngenta.com" autocomplete="email"/>
      <div class="error-msg" id="emailError"></div>
    </div>

    <hr class="divider"/>

    <div class="form-group">
      <label>Choose a Session</label>
      <div id="topicGroupsContainer"></div>
      <div class="error-msg" id="sessionError"></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">
      <span id="btnText">Register Now</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>
    <span class="reset-link" onclick="resetCounts()">Reset all counts (admin)</span>
  </div>

  <!-- Success Screen -->
  <div class="success-screen" id="successSection">
    <div class="success-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#005a2b" stroke-width="2"/>
        <path d="M7.5 12.5l3 3 6-6" stroke="#005a2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="success-title" id="successTitle">You're registered!</div>
    <div class="success-detail" id="successDetail"></div>
    <div class="success-request-note" id="successRequestNote" style="display:none;"></div>
    <div class="email-sent-note" id="emailSentNote" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
        <path d="M2 5l8 5 8-5M2 5h16v11a1 1 0 01-1 1H3a1 1 0 01-1-1V5z" stroke="#2d6a2d" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span id="emailSentText"></span>
    </div>
    <button class="btn-another" onclick="registerAnother()">Register Another Person</button>
  </div>
</div>

<script>
  // ── EmailJS config ──────────────────────────────────────────────────
  const EMAILJS_PUBLIC_KEY  = "V1zqyUhyw-7PaBw2v";
  const EMAILJS_SERVICE_ID  = "service_3vz79x3";
  const EMAILJS_TEMPLATE_ID = "template_5rooetf";
  // ───────────────────────────────────────────────────────────────────

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  const MAX    = 0;
  const WARN_AT = 20;

  // ── Edit sessions here ──────────────────────────────────────────────
  const TOPICS = [
    {
      id: "t1",
      name: "Introduction to SAP S/4HANA",
      sessions: [
        { id: "s1", time: "Monday, June 2 · 9:00 AM – 10:00 AM" },
        { id: "s2", time: "Monday, June 2 · 1:00 PM – 2:00 PM" },
      ]
    },
    {
      id: "t2",
      name: "Data Management Best Practices",
      sessions: [
        { id: "s3", time: "Tuesday, June 3 · 10:00 AM – 11:00 AM" },
        { id: "s4", time: "Tuesday, June 3 · 2:00 PM – 3:00 PM" },
      ]
    },
    {
      id: "t3",
      name: "Reporting & Analytics Overview",
      sessions: [
        { id: "s5", time: "Wednesday, June 4 · 9:00 AM – 10:00 AM" },
        { id: "s6", time: "Wednesday, June 4 · 3:00 PM – 4:00 PM" },
      ]
    }
  ];

  const TIME_PREF_OPTIONS = ["Morning (8 AM–12 PM)", "Afternoon (12–4 PM)", "Late Afternoon (4–6 PM)", "Any time"];
  // ───────────────────────────────────────────────────────────────────

  let selectedSession   = null;
  let requestedTopicId  = null;
  let selectedTimePrefs = {};

  function getCounts()    { return JSON.parse(localStorage.getItem("sessionCounts") || "{}"); }
  function saveCounts(c)  { localStorage.setItem("sessionCounts", JSON.stringify(c)); }
  function getCount(id)   { return getCounts()[id] || 0; }
  function incrementCount(id) { const c = getCounts(); c[id] = (c[id]||0)+1; saveCounts(c); }

  function resetCounts() {
    if (!confirm("Reset all session counts? (Admin only)")) return;
    localStorage.removeItem("sessionCounts");
    renderTopics();
  }

  function isTopicFull(topic) {
    return topic.sessions.every(s => getCount(s.id) >= MAX);
  }

  function renderTopics() {
    selectedSession   = null;
    requestedTopicId  = null;
    selectedTimePrefs = {};

    const container = document.getElementById("topicGroupsContainer");
    container.innerHTML = "";

    TOPICS.forEach(topic => {
      const topicFull = isTopicFull(topic);
      const group = document.createElement("div");
      group.className = "topic-group";

      const header = document.createElement("div");
      header.className = "topic-header";
      header.innerHTML = `
        <div class="topic-name">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="3" width="16" height="14" rx="2" stroke="${topicFull ? "#c0392b" : "#005a2b"}" stroke-width="1.8"/>
            <path d="M6 7h8M6 10h6M6 13h4" stroke="${topicFull ? "#c0392b" : "#005a2b"}" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          ${topic.name}
        </div>
        <span class="topic-badge ${topicFull ? "badge-full" : "badge-available"}">
          ${topicFull ? "All sessions full" : "Spots available"}
        </span>`;
      group.appendChild(header);

      const grid = document.createElement("div");
      grid.className = "sessions-grid";

      topic.sessions.forEach(s => {
        const count     = getCount(s.id);
        const isFull    = count >= MAX;
        const isWarn    = count >= WARN_AT && !isFull;
        const remaining = MAX - count;
        const pct       = Math.min(100, Math.round((count / MAX) * 100));

        const card = document.createElement("label");
        card.className = "session-card" + (isFull ? " full" : "");
        card.htmlFor   = "radio_" + s.id;
        card.id        = "card_" + s.id;

        const barClass  = isFull ? "capacity-bar full-bar" : isWarn ? "capacity-bar warning" : "capacity-bar";
        const textClass = isFull ? "capacity-text full-text" : isWarn ? "capacity-text warning" : "capacity-text";
        const textLabel = isFull ? "Full" : `${count} / ${MAX} registered`;

        let alertHtml = "";
        if (isFull) {
          alertHtml = `<div class="alert-banner alert-full">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#922b21" stroke-width="2"/><path d="M10 6v5M10 14v.5" stroke="#922b21" stroke-width="2" stroke-linecap="round"/></svg>
            This session is full — no spots remaining.</div>`;
        } else if (isWarn) {
          alertHtml = `<div class="alert-banner alert-warning">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M9.134 3.37L2.084 15.5A1 1 0 003 17h14a1 1 0 00.866-1.5L10.866 3.37a1 1 0 00-1.732 0z" stroke="#a05a00" stroke-width="1.8"/><path d="M10 8v4M10 14v.5" stroke="#a05a00" stroke-width="1.8" stroke-linecap="round"/></svg>
            Almost full — only <strong>${remaining} spot${remaining===1?"":"s"}</strong> left!</div>`;
        }

        card.innerHTML = `
          <input type="radio" name="session" id="radio_${s.id}" value="${s.id}" ${isFull?"disabled":""}/>
          <div class="session-top">
            <div class="session-left">
              <div class="radio-dot"><div class="radio-dot-inner"></div></div>
              <div class="session-info">
                <div class="session-topic">${topic.name}</div>
                <div class="session-time">${s.time}</div>
              </div>
            </div>
            <div class="session-right">
              <div class="${textClass}">${textLabel}</div>
              <div class="capacity-bar-wrap">
                <div class="${barClass}" style="width:${pct}%"></div>
              </div>
            </div>
          </div>${alertHtml}`;

        if (!isFull) {
          card.addEventListener("click", () => {
            document.querySelectorAll(".session-card").forEach(c => c.classList.remove("selected"));
            card.classList.add("selected");
            selectedSession  = s.id;
            requestedTopicId = null;
            // uncheck any request boxes
            document.querySelectorAll("[id^='reqCheck_']").forEach(cb => {
              cb.checked = false;
              const panel = document.getElementById("reqPanel_" + cb.id.replace("reqCheck_",""));
              if (panel) panel.classList.remove("open");
            });
            requestedTopicId = null;
            document.getElementById("sessionError").textContent = "";
          });
        }

        grid.appendChild(card);
      });

      group.appendChild(grid);

      if (topicFull) {
        selectedTimePrefs[topic.id] = new Set();
        const reqBox = document.createElement("div");
        reqBox.className = "request-time-box";
        reqBox.id = "reqBox_" + topic.id;
        const cbId = "reqCheck_" + topic.id;

        reqBox.innerHTML = `
          <div class="request-time-trigger" onclick="toggleRequestPanel('${topic.id}')">
            <input type="checkbox" id="${cbId}" onclick="event.stopPropagation();toggleRequestPanel('${topic.id}')"/>
            <div class="request-time-label">
              Request additional time slots for this topic
              <span>— We'll reach out if a new session is added</span>
            </div>
          </div>
          <div class="request-time-panel" id="reqPanel_${topic.id}">
            <label>Preferred times <span style="font-weight:400;color:#888;">(select all that apply)</span></label>
            <div class="time-prefs" id="timePrefs_${topic.id}"></div>
            <label class="request-note-label" style="margin-top:14px;">Additional notes <span style="font-weight:400;color:#888;">(optional)</span></label>
            <textarea id="reqNote_${topic.id}" placeholder="e.g. Any Friday morning slot would work great..." rows="2"></textarea>
          </div>`;

        group.appendChild(reqBox);

        setTimeout(() => {
          const prefsContainer = document.getElementById("timePrefs_" + topic.id);
          if (!prefsContainer) return;
          TIME_PREF_OPTIONS.forEach(opt => {
            const btn = document.createElement("div");
            btn.className = "time-pref-btn";
            btn.textContent = opt;
            btn.onclick = () => {
              const set = selectedTimePrefs[topic.id];
              if (set.has(opt)) { set.delete(opt); btn.classList.remove("selected"); }
              else              { set.add(opt);    btn.classList.add("selected"); }
            };
            prefsContainer.appendChild(btn);
          });
        }, 0);
      }

      container.appendChild(group);
    });
  }

  function toggleRequestPanel(topicId) {
    const checkbox = document.getElementById("reqCheck_" + topicId);
    const panel    = document.getElementById("reqPanel_" + topicId);
    checkbox.checked = !checkbox.checked;
    panel.classList.toggle("open", checkbox.checked);

    if (checkbox.checked) {
      requestedTopicId = topicId;
      selectedSession  = null;
      document.querySelectorAll(".session-card").forEach(c => c.classList.remove("selected"));
      document.getElementById("sessionError").textContent = "";
    } else {
      if (requestedTopicId === topicId) requestedTopicId = null;
    }
  }

  function setLoading(loading) {
    const btn     = document.getElementById("submitBtn");
    const txt     = document.getElementById("btnText");
    const spinner = document.getElementById("btnSpinner");
    btn.disabled        = loading;
    txt.textContent     = loading ? "Sending..." : (requestedTopicId ? "Submit Request" : "Register Now");
    spinner.style.display = loading ? "block" : "none";
  }

  async function handleSubmit() {
    let valid = true;
    const name  = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();

    document.getElementById("nameError").textContent    = "";
    document.getElementById("emailError").textContent   = "";
    document.getElementById("sessionError").textContent = "";

    if (!name) { document.getElementById("nameError").textContent = "Please enter your full name."; valid = false; }
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      document.getElementById("emailError").textContent = "Please enter a valid email address."; valid = false;
    }
    if (!selectedSession && !requestedTopicId) {
      document.getElementById("sessionError").textContent = "Please select a session or request additional times for a full topic.";
      valid = false;
    }
    if (!valid) return;

    // ── Path A: Normal registration ──
    if (selectedSession) {
      const count = getCount(selectedSession);
      if (count >= MAX) {
        document.getElementById("sessionError").textContent = "This session just filled up. Please choose another.";
        renderTopics(); return;
      }
      incrementCount(selectedSession);
      const allSessions = TOPICS.flatMap(t => t.sessions);
      const session     = allSessions.find(s => s.id === selectedSession);
      const topic       = TOPICS.find(t => t.sessions.some(s => s.id === selectedSession));
      const remaining   = MAX - getCount(selectedSession);

      let spotsNote = "";
      if (remaining === 0) spotsNote = "<br/><em style='color:#c0392b;font-size:0.88rem;'>You took the last spot — this session is now full.</em>";
      else if (remaining <= 5) spotsNote = `<br/><em style='color:#e07c00;font-size:0.88rem;'>${remaining} spot${remaining===1?"":"s"} remaining after your registration.</em>`;

      document.getElementById("successTitle").textContent = "You're registered!";
      document.getElementById("successDetail").innerHTML = `
        <strong>${name}</strong>, you're confirmed for:<br/>
        <strong style="color:#005a2b;">${topic.name}</strong><br/>
        <span style="color:#556b55;">${session.time}</span><br/>
        Confirmation noted for <strong>${email}</strong>.${spotsNote}`;
      document.getElementById("successRequestNote").style.display = "none";
      document.getElementById("emailSentNote").style.display = "none";

      showSuccess();

    // ── Path B: Request additional times → send email via EmailJS ──
    } else {
      const topic = TOPICS.find(t => t.id === requestedTopicId);
      const prefs = [...(selectedTimePrefs[requestedTopicId] || [])];
      const note  = (document.getElementById("reqNote_" + requestedTopicId)||{}).value || "";

      setLoading(true);

      const templateParams = {
        name,
        from_email: email,
        topic:     topic.name,
        prefs:     prefs.length > 0 ? prefs.join(", ") : "No preference specified",
        note:      note.trim() || "None",
        timestamp: new Date().toLocaleString("en-US", { dateStyle:"full", timeStyle:"short" })
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

        document.getElementById("successTitle").textContent = "Request received!";
        document.getElementById("successDetail").innerHTML = `
          <strong>${name}</strong>, thanks for letting us know.<br/>
          All current sessions for <strong style="color:#005a2b;">${topic.name}</strong> are full.<br/>
          We'll reach out at <strong>${email}</strong> if new time slots open up.`;

        const reqNote = document.getElementById("successRequestNote");
        if (prefs.length > 0 || note.trim()) {
          let noteHtml = "<strong>Your preferences:</strong><br/>";
          if (prefs.length > 0) noteHtml += `Preferred times: ${prefs.join(", ")}<br/>`;
          if (note.trim())      noteHtml += `Notes: "${note.trim()}"`;
          reqNote.innerHTML = noteHtml;
          reqNote.style.display = "block";
        } else {
          reqNote.style.display = "none";
        }

        const emailNote = document.getElementById("emailSentNote");
        document.getElementById("emailSentText").textContent = "A notification email has been sent to nathane.pieper@syngenta.com";
        emailNote.style.display = "flex";

        showSuccess();

      } catch (err) {
        setLoading(false);
        document.getElementById("sessionError").textContent =
          "Email could not be sent — please try again or contact the organizer directly.";
        console.error("EmailJS error:", err);
      }
    }
  }

  function showSuccess() {
    setLoading(false);
    document.getElementById("formSection").style.display    = "none";
    document.getElementById("successSection").style.display = "block";
  }

  function registerAnother() {
    document.getElementById("fullName").value = "";
    document.getElementById("email").value    = "";
    document.getElementById("formSection").style.display    = "block";
    document.getElementById("successSection").style.display = "none";
    renderTopics();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  renderTopics();
</script>
</body>
</html>
